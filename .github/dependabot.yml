version: 2
updates:
  # bun ecosystem, not npm: the lockfile is bun.lock and CI installs it frozen.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # Every dependency is a devDependency bundled into dist, so one catch-all group.
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # TypeScript stays on 6 with the rest of the fleet; a major moves by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
