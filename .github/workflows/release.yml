name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'patch | minor | major'
        required: false
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # package.json, manifest.json and server.json carry one version.
      - name: Bump version
        id: bump
        run: |
          npm version ${{ github.event.inputs.version_bump || 'patch' }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          bunx biome format --write package.json manifest.json server.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: bun run test

      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance

      - name: Pack desktop extension
        run: bun run pack:mcpb

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json server.json
          git commit -m "release: v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          make_latest: 'true'
          files: astrology-mcp-server.mcpb
